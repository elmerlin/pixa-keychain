name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --silent
      - run: npm run package:chromium
      - run: npm run build:firefox
      - name: Hash the Chromium build
        run: |
          rm -rf /tmp/built && mkdir /tmp/built && unzip -q pixtopia-keychain-*-chromium.zip -d /tmp/built
          (cd /tmp/built && find . -type f | LC_ALL=C sort | xargs sha256sum) | sha256sum | tee -a "$GITHUB_STEP_SUMMARY"
